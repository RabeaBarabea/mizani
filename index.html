        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, message: '' };

                return { hasError: true, message: error?.message || 'حدث خطأ غير متوقع' };

                return this.props.children;

        // --- SVG Geometry Helpers for Wheel of Life ---
        const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
            const angleInRadians = ((angleInDegrees - 90) * Math.PI) / 180.0;
            return {
                x: centerX + radius * Math.cos(angleInRadians),
                y: centerY + radius * Math.sin(angleInRadians),
            };
        };

        const describeArc = (x, y, radius, startAngle, endAngle) => {
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
            return [
                'M', x, y,
                'L', start.x, start.y,
                'A', radius, radius, 0, largeArcFlag, 0, end.x, end.y,
                'Z',
            ].join(' ');
        };

                    ],
                },

                    goals: [
                        { id: 'y5', type: 'binary', text: 'الجري لمسافة 5 كم متواصلة', completed: true },

                    ],
                },
            ],
        };

        // --- Local-Only Storage & Mobile Haptic Helpers ---
        const STORAGE_KEYS = {
            data: 'mizani_local_data_v1',
            period: 'mizani_local_period_v1',
            viewMode: 'mizani_local_view_v1',
            selectedDomain: 'mizani_local_selected_domain_v1',
        };

        const isValidMizaniData = (obj) => {
            return (
                obj &&
                typeof obj === 'object' &&
                Array.isArray(obj.weekly) &&
                Array.isArray(obj.monthly) &&
                Array.isArray(obj.yearly)
            );
        };

        const loadSavedData = () => {
            try {
                const raw = window.localStorage.getItem(STORAGE_KEYS.data);
                if (!raw) return initialData;
                const parsed = JSON.parse(raw);
                if (isValidMizaniData(parsed)) return parsed;
            } catch (err) {}
            return initialData;
        };

        const loadSavedString = (key, allowed, fallback) => {
            try {
                const val = window.localStorage.getItem(key);
                if (val && (!allowed || allowed.includes(val))) return val;
            } catch (err) {}
            return fallback;
        };

        const triggerHaptic = () => {
            try {
                if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
                    navigator.vibrate(10);
                }
            } catch (err) {}
        };

        // --- Score Calculation Helpers (Equal Weight per Domain) ---
        const getGoalProgress = (goal) => {
            if (goal.type === 'binary') {
                return goal.completed ? 100 : 0;
            }
            const target = Math.max(1, Number(goal.target) || 1);
            const current = Math.max(0, Number(goal.current) || 0);
            return Math.min(100, (current / target) * 100);
        };

        const calculateDomainScore = (domain) => {
            if (!domain || !domain.goals || domain.goals.length === 0) return 0;
            const total = domain.goals.reduce((sum, goal) => sum + getGoalProgress(goal), 0);
            return Math.round(total / domain.goals.length);
        };

        const calculateOverallScore = (domains) => {
            if (!domains || domains.length === 0) return 0;
            const total = domains.reduce((sum, domain) => sum + calculateDomainScore(domain), 0);
            return Math.round(total / domains.length);
        };

        // --- Subtle Circular Overall Progress Badge ---
        const OverallProgressRing = ({ score }) => {
            const radius = 24;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (score / 100) * circumference;

            return (
                <div className="relative w-14 h-14 flex items-center justify-center flex-shrink-0">
                    <svg className="w-14 h-14 -rotate-90" viewBox="0 0 60 60">
                        <circle
                            cx="30"
                            cy="30"
                            r={radius}
                            fill="none"
                            stroke="#f1f5f9"
                            strokeWidth="5"
                        />
                        <circle
                            cx="30"
                            cy="30"
                            r={radius}
                            fill="none"
                            stroke="#14b8a6"
                            strokeWidth="5"
                            strokeLinecap="round"
                            strokeDasharray={circumference}
                            strokeDashoffset={strokeDashoffset}
                            className="svg-transition"
                        />
                    </svg>
                    <span className="absolute text-xs font-extrabold text-slate-800">{score}%</span>
                </div>
            );
        };

        // --- Interactive Wheel of Life Component ---
        const WheelOfLife = ({ domains, selectedDomainId, onSegmentClick, isEmpty = false }) => {
            const size = 250;
            const center = size / 2;
            const radius = 94;

            if (isEmpty || domains.length === 0) {
                const emptySlices = 6;
                const anglePerSlice = 360 / emptySlices;
                return (
                    <div className="flex justify-center items-center py-2">
                        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="overflow-visible">
                            {[0.33, 0.66, 1].map((scale, idx) => (
                                <circle
                                    key={idx}
                                    cx={center}
                                    cy={center}
                                    r={radius * scale}
                                    fill="none"
                                    stroke="#e2e8f0"
                                    strokeDasharray="4 4"
                                    strokeWidth="1"
                                />
                            ))}
                            {Array.from({ length: emptySlices }).map((_, i) => {
                                const path = describeArc(center, center, radius, i * anglePerSlice, (i + 1) * anglePerSlice);
                                return (
                                    <path
                                        key={i}
                                        d={path}
                                        fill="#f8fafc"
                                        stroke="#e2e8f0"
                                        strokeWidth="1.5"
                                    />
                                );
                            })}
                            <circle cx={center} cy={center} r="10" fill="#cbd5e1" />
                        </svg>
                    </div>
                );
            }

            const anglePerSlice = 360 / domains.length;

            return (
                <div className="flex flex-col items-center py-1">
                    <svg
                        width={size}
                        height={size}
                        viewBox={`0 0 ${size} ${size}`}
                        className="overflow-visible"
                        role="img"
                        aria-label="عجلة الحياة"
                    >
                        {[0.33, 0.66, 1].map((scale, idx) => (
                            <circle
                                key={idx}
                                cx={center}
                                cy={center}
                                r={radius * scale}
                                fill="none"
                                stroke="#f1f5f9"
                                strokeWidth="1"
                            />
                        ))}

                        {domains.length === 1 ? (() => {
                            const domain = domains[0];
                            const score = calculateDomainScore(domain);
                            const fillRadius = Math.max(16, (score / 100) * radius);
                            return (
                                <g onClick={() => onSegmentClick(domain.id)} className="cursor-pointer">
                                    <circle cx={center} cy={center} r={radius} fill="#f0fdfa" stroke="#99f6e4" strokeWidth="2" />
                                    <circle cx={center} cy={center} r={fillRadius} fill="#0d9488" className="svg-transition" />
                                    <text
                                        x={center}
                                        y={center - radius - 16}
                                        textAnchor="middle"
                                        dominantBaseline="central"
                                        fontSize="16"
                                    >
                                        {domain.icon}
                                    </text>
                                </g>
                            );
                        })() : (
                            domains.map((domain, i) => {
                                const startAngle = i * anglePerSlice;
                                const endAngle = (i + 1) * anglePerSlice;
                                const score = calculateDomainScore(domain);
                                const fillRadius = Math.max(16, (score / 100) * radius);
                                const isSelected = selectedDomainId === domain.id;
                                const isDimmed = Boolean(selectedDomainId) && !isSelected;

                                const bgPath = describeArc(center, center, radius, startAngle, endAngle);
                                const fgPath = describeArc(center, center, fillRadius, startAngle, endAngle);

                                const midAngle = startAngle + anglePerSlice / 2;
                                const labelPos = polarToCartesian(center, center, radius + 21, midAngle);

                                return (
                                    <g
                                        key={domain.id}
                                        onClick={() => onSegmentClick(domain.id)}
                                        className="cursor-pointer group"
                                        style={{
                                            opacity: isDimmed ? 0.45 : 1,
                                            transition: 'opacity 0.25s ease',
                                        }}
                                    >
                                        <path
                                            d={bgPath}
                                            fill={isSelected ? '#f0fdfa' : '#f8fafc'}
                                            stroke={isSelected ? '#5eead4' : '#ffffff'}
                                            strokeWidth={isSelected ? '2.5' : '2'}
                                            className="svg-transition"
                                        />
                                        <path
                                            d={fgPath}
                                            fill={isSelected ? '#0d9488' : '#14b8a6'}
                                            fillOpacity={isSelected ? 0.95 : 0.78}
                                            stroke="#ffffff"
                                            strokeWidth="1.5"
                                            className="svg-transition"
                                        />
                                        <text
                                            x={labelPos.x}
                                            y={labelPos.y}
                                            textAnchor="middle"
                                            dominantBaseline="central"
                                            fontSize={isSelected ? '17' : '15'}
                                            className="select-none pointer-events-none"
                                        >

                                        </text>
                                    </g>

        const GoalItem = ({ goal, onToggle, onUpdateNumeric, onRemove }) => {
            const DeleteButton = () => (

                    type="button"

                    className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 active:bg-red-100 transition-colors flex-shrink-0"

                return (
                    <div className="w-full flex items-center justify-between gap-2 p-2.5 rounded-2xl hover:bg-slate-50/80 transition-colors min-h-[48px]">
                        <button
                            type="button"
                            onClick={onToggle}
                            className="flex-1 flex items-center gap-3 text-right py-1"
                        >

                                className={`w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 border transition-all ${

                                        ? 'bg-brand-500 border-brand-500 text-white'
                                        : 'border-slate-300 bg-white text-transparent'

                            >

                            <span

                                    goal.completed ? 'text-slate-400 line-through' : 'text-slate-700'

                            </span>

            const step = goal.step || 1;
            const isCompleted = goal.current >= goal.target;

        // --- Lightweight Inline Add Domain Form ---

        // --- Minimal PWA Install Card (Calm & Dismissible) ---
        const PwaInstallCard = ({ canInstall, isIosBrowser, onInstall, onDismiss }) => {

            if (!canInstall && !isIosBrowser) return null;

            return (
                <div className="mx-4 mt-5 bg-surface border border-brand-200/70 rounded-2xl p-3.5 shadow-sm space-y-2.5">
                    <div className="flex items-center justify-between gap-3">

                        </p>

        // --- Subtle Local Storage Footer (Privacy + Optional JSON Backup/Restore) ---
        const LocalStorageFooter = ({ dataByPeriod, onImportData, isPersisted, justSaved }) => {
            const fileInputRef = useRef(null);
            const [statusMsg, setStatusMsg] = useState('');

            const showStatus = (msg) => {
                setStatusMsg(msg);
                setTimeout(() => setStatusMsg(''), 3000);
            };

            const handleExport = () => {
                try {
                    const payload = JSON.stringify(dataByPeriod, null, 2);
                    const blob = new Blob([payload], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dateStr = new Date().toISOString().slice(0, 10);
                    a.href = url;
                    a.download = `mizani-backup-${dateStr}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showStatus('تم حفظ النسخة الاحتياطية على جهازك');
                } catch (err) {
                    showStatus('تعذر تصدير النسخة الاحتياطية');
                }
            };

            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (isValidMizaniData(parsed)) {
                            onImportData(parsed);
                            showStatus('تمت استعادة بياناتك بنجاح');
                        } else {
                            showStatus('ملف النسخة الاحتياطية غير صالح');
                        }
                    } catch (err) {
                        showStatus('تعذر قراءة الملف');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <footer className="px-5 pt-6 pb-2 text-center space-y-2">
                    <p className="text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
                        <span
                            className={`w-1.5 h-1.5 rounded-full transition-colors ${
                                justSaved ? 'bg-brand-500' : 'bg-emerald-400'
                            }`}
                        ></span>
                        <span>
                            {justSaved
                                ? 'تم الحفظ محليًا على جهازك ✓'
                                : isPersisted
                                ? 'بياناتك محفوظة محليًا بشكل دائم على جهازك'
                                : 'بياناتك محفوظة محليًا على جهازك فقط'}
                        </span>
                    </p>
                    <div className="flex items-center justify-center gap-3 text-[11px] font-medium">
                        <button
                            type="button"
                            onClick={handleExport}
                            className="text-slate-500 hover:text-brand-600 transition-colors py-1 px-2"
                        >
                            حفظ نسخة احتياطية
                        </button>
                        <span className="text-slate-300">•</span>
                        <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="text-slate-500 hover:text-brand-600 transition-colors py-1 px-2"
                        >
                            استعادة نسخة
                        </button>
                        <input
                            ref={fileInputRef}
                            type="file"
                            accept="application/json,.json"
                            onChange={handleFileChange}
                            className="hidden"
                        />
                    </div>
                    {statusMsg && (
                        <p className="text-[11px] font-bold text-brand-600">{statusMsg}</p>
                    )}
                </footer>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [period, setPeriod] = useState(() =>
                loadSavedString(STORAGE_KEYS.period, ['weekly', 'monthly', 'yearly'], 'weekly')
            );
            const [dataByPeriod, setDataByPeriod] = useState(loadSavedData);
            const [selectedDomainId, setSelectedDomainId] = useState(() => {
                const savedId = loadSavedString(STORAGE_KEYS.selectedDomain, null, null);
                const initial = loadSavedData();
                const savedPeriod = loadSavedString(STORAGE_KEYS.period, ['weekly', 'monthly', 'yearly'], 'weekly');
                const list = initial[savedPeriod] || [];
                if (savedId && list.some((d) => d.id === savedId)) return savedId;
                return list[0]?.id || null;
            });
            const [viewMode, setViewMode] = useState(() =>
                loadSavedString(STORAGE_KEYS.viewMode, ['focus', 'all'], 'focus')
            );
            const [showAddDomain, setShowAddDomain] = useState(false);

            // PWA Install & Offline States
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [dismissedInstall, setDismissedInstall] = useState(false);
            const [isOffline, setIsOffline] = useState(() =>
                typeof navigator !== 'undefined' ? !navigator.onLine : false
            );
            const [isPersisted, setIsPersisted] = useState(false);
            const [justSaved, setJustSaved] = useState(false);
            const isFirstRender = useRef(true);

            const isStandalone = useMemo(() => {
                if (typeof window === 'undefined') return false;
                return (
                    window.matchMedia?.('(display-mode: standalone)')?.matches ||
                    window.navigator?.standalone === true
                );
            }, []);

            const isIosBrowser = useMemo(() => {
                if (typeof navigator === 'undefined') return false;
                return /iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone;
            }, [isStandalone]);

            useEffect(() => {
                try {
                    window.localStorage.setItem(STORAGE_KEYS.data, JSON.stringify(dataByPeriod));
                    if (isFirstRender.current) {
                        isFirstRender.current = false;
                    } else {
                        setJustSaved(true);
                        const timer = setTimeout(() => setJustSaved(false), 1800);
                        return () => clearTimeout(timer);
                    }
                } catch (err) {}
            }, [dataByPeriod]);

            useEffect(() => {
                const requestPersistence = async () => {
                    try {
                        if (navigator.storage && navigator.storage.persist) {
                            const alreadyPersisted = await navigator.storage.persisted();
                            if (alreadyPersisted) {
                                setIsPersisted(true);
                            } else {
                                const granted = await navigator.storage.persist();
                                setIsPersisted(Boolean(granted));
                            }
                        }
                    } catch (err) {}
                };
                requestPersistence();
            }, []);

            useEffect(() => {
                try {
                    window.localStorage.setItem(STORAGE_KEYS.period, period);
                } catch (err) {}
            }, [period]);

            useEffect(() => {
                try {
                    window.localStorage.setItem(STORAGE_KEYS.viewMode, viewMode);
                } catch (err) {}
            }, [viewMode]);

            useEffect(() => {
                try {
                    if (selectedDomainId) {
                        window.localStorage.setItem(STORAGE_KEYS.selectedDomain, selectedDomainId);
                    }
                } catch (err) {}
            }, [selectedDomainId]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                const handleAppInstalled = () => {
                    setDeferredPrompt(null);
                    setDismissedInstall(true);
                };
                const handleOnline = () => setIsOffline(false);
                const handleOffline = () => setIsOffline(true);

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                window.addEventListener('appinstalled', handleAppInstalled);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                return () => {
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                    window.removeEventListener('appinstalled', handleAppInstalled);
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            const handlePwaInstall = async () => {
                if (!deferredPrompt) return;
                try {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                    }
                } catch (err) {}
            };

            const domainRefs = useRef({});
            const domains = dataByPeriod[period] || [];

            useEffect(() => {
                if (domains.length === 0) {
                    setSelectedDomainId(null);
                } else if (!domains.some((d) => d.id === selectedDomainId)) {
                    setSelectedDomainId(domains[0].id);
                }
            }, [period, domains, selectedDomainId]);

            const overallScore = useMemo(() => calculateOverallScore(domains), [domains]);

            const updateCurrentDomains = (updater) => {
                setDataByPeriod((prev) => ({
                    ...prev,
                    [period]: updater(prev[period]),
                }));
            };

            const toggleGoal = (domainId, goalId) => {
                triggerHaptic();
                updateCurrentDomains((list) =>
                    list.map((d) =>
                        d.id !== domainId
                            ? d
                            : {
                                  ...d,
                                  goals: d.goals.map((g) =>
                                      g.id === goalId ? { ...g, completed: !g.completed } : g
                                  ),
                              }
                    )
                );
            };

            const updateNumericGoal = (domainId, goalId, delta) => {
                triggerHaptic();
                updateCurrentDomains((list) =>
                    list.map((d) =>
                        d.id !== domainId
                            ? d
                            : {
                                  ...d,
                                  goals: d.goals.map((g) => {
                                      if (g.id !== goalId) return g;
                                      const nextVal = Math.max(0, Math.min(g.target, g.current + delta));
                                      return { ...g, current: nextVal };
                                  }),
                              }
                    )
                );
            };

            const addGoal = (domainId, newGoal) => {
                updateCurrentDomains((list) =>
                    list.map((d) => (d.id !== domainId ? d : { ...d, goals: [...d.goals, newGoal] }))
                );
            };

            const removeGoal = (domainId, goalId) => {
                updateCurrentDomains((list) =>
                    list.map((d) =>
                        d.id !== domainId
                            ? d
                            : { ...d, goals: d.goals.filter((g) => g.id !== goalId) }
                    )
                );
            };

            const addDomain = (name) => {
                const iconMap = {
                    العلاقات: '🤝',
                    الاجتماعي: '🤝',
                    الترفيهي: '🌿',
                    الشخصي: '✨',
                    السفر: '✈️',
                };
                const newId = 'domain_' + Date.now();
                const newDomain = {
                    id: newId,
                    name,
                    icon: iconMap[name] || '🌱',
                    goals: [],
                };
                updateCurrentDomains((list) => [...list, newDomain]);
                setSelectedDomainId(newId);
                setViewMode('focus');
                setShowAddDomain(false);
            };

            const removeDomain = (domainId) => {
                updateCurrentDomains((list) => list.filter((d) => d.id !== domainId));
            };

            const restoreDefaults = () => {
                setDataByPeriod((prev) => ({
                    ...prev,
                    [period]: initialData[period],
                }));
                setSelectedDomainId(initialData[period][0]?.id || null);
            };

            const handleSelectDomain = (domainId) => {
                setSelectedDomainId(domainId);
                if (viewMode === 'all' && domainRefs.current[domainId]) {
                    domainRefs.current[domainId].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            const goToNextDomain = () => {
                if (domains.length <= 1) return;
                const currentIndex = domains.findIndex((d) => d.id === selectedDomainId);
                const nextIndex = (currentIndex + 1) % domains.length;
                setSelectedDomainId(domains[nextIndex].id);
            };

            const activeDomain = domains.find((d) => d.id === selectedDomainId) || domains[0];
            const activeIndex = domains.findIndex((d) => d.id === activeDomain?.id);
            const nextDomain = domains.length > 1 ? domains[(activeIndex + 1) % domains.length] : null;

            return (
                <div className="min-h-screen bg-background flex justify-center">
                    <main className="w-full max-w-[430px] min-h-screen flex flex-col safe-bottom">
                        {/* --- TOP HEADER & WHEEL OF LIFE --- */}
                        <header className="bg-surface rounded-b-[2rem] border-b border-slate-200/70 px-5 safe-top pb-5 shadow-sm space-y-5">
                            {isOffline && (
                                <div className="text-center">
                                    <span className="inline-flex items-center gap-1.5 text-[11px] font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-full">
                                        <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                                        وضع عدم الاتصال — تغييراتك محفوظة محليًا
                                    </span>
                                </div>
                            )}

                            <div className="flex items-center justify-between gap-3">
                                <div>
                                    <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">ميزاني</h1>
                                    <p className="text-xs text-slate-500 mt-0.5">توازن أفضل، خطوة بخطوة</p>
                                </div>

                                <div
                                    className="bg-slate-100 p-1 rounded-2xl flex items-center"
                                    role="tablist"
                                    aria-label="الفترة الزمنية"
                                >
                                    <button
                                        type="button"
                                        role="tab"
                                        aria-selected={period === 'weekly'}
                                        onClick={() => setPeriod('weekly')}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                                            period === 'weekly'
                                                ? 'bg-white text-brand-600 shadow-sm'
                                                : 'text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        أسبوعي
                                    </button>
                                    <button
                                        type="button"
                                        role="tab"
                                        aria-selected={period === 'monthly'}
                                        onClick={() => setPeriod('monthly')}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                                            period === 'monthly'
                                                ? 'bg-white text-brand-600 shadow-sm'
                                                : 'text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        شهري
                                    </button>
                                    <button
                                        type="button"
                                        role="tab"
                                        aria-selected={period === 'yearly'}
                                        onClick={() => setPeriod('yearly')}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                                            period === 'yearly'
                                                ? 'bg-white text-brand-600 shadow-sm'
                                                : 'text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        سنوي
                                    </button>
                                </div>
                            </div>

                            {domains.length > 0 ? (
                                <div className="flex items-center justify-between bg-slate-50/90 border border-slate-100 rounded-2xl px-4 py-3">
                                    <div>
                                        <p className="text-xs text-slate-500">
                                            {period === 'weekly'
                                                ? 'إنجازك هذا الأسبوع'
                                                : period === 'monthly'
                                                ? 'إنجازك هذا الشهر'
                                                : 'إنجازك هذه السنة'}
                                        </p>
                                        <p className="text-lg font-extrabold text-slate-800 mt-0.5">
                                            {overallScore}%{' '}
                                            <span className="text-xs font-medium text-slate-500">
                                                متوسط {domains.length} مجالات
                                            </span>
                                        </p>
                                    </div>
                                    <OverallProgressRing score={overallScore} />
                                </div>
                            ) : (
                                <div className="text-center bg-slate-50 border border-slate-100 rounded-2xl px-4 py-4 space-y-1">
                                    <p className="text-base font-bold text-slate-800">ابدأ ببناء ميزانك</p>
                                    <p className="text-xs text-slate-500">أضف أهدافك في المجالات التي تهمك.</p>
                                </div>
                            )}

                            <WheelOfLife
                                domains={domains}
                                selectedDomainId={viewMode === 'focus' ? selectedDomainId : null}
                                onSegmentClick={handleSelectDomain}
                                isEmpty={domains.length === 0}
                            />
                        </header>

                        {/* --- MAIN CONTENT --- */}
                        {domains.length === 0 ? (
                            <div className="px-5 pt-6 space-y-4">
                                <AddDomainForm onAdd={addDomain} buttonText="أضف أول هدف / مجال" />
                                <button
                                    type="button"
                                    onClick={restoreDefaults}
                                    className="w-full py-2.5 text-xs font-medium text-slate-400 hover:text-brand-600 transition-colors"
                                >
                                    استعادة المجالات الافتراضية
                                </button>
                            </div>
                        ) : (
                            <div className="flex-1 px-4 pt-5 space-y-4">
                                <div className="flex items-center justify-between px-1">
                                    <span className="text-xs font-bold text-slate-500">
                                        {viewMode === 'focus'
                                            ? 'ركّز على مجال واحد'
                                            : `جميع المجالات (${domains.length})`}
                                    </span>
                                    <button
                                        type="button"
                                        onClick={() => setViewMode((prev) => (prev === 'focus' ? 'all' : 'focus'))}
                                        className="text-xs font-bold text-brand-600 hover:text-brand-700 bg-brand-50 px-3 py-1.5 rounded-full transition-colors"
                                    >
                                        {viewMode === 'focus' ? 'عرض الكل' : 'وضع التركيز'}
                                    </button>
                                </div>

                                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4">
                                    {domains.map((domain) => {
                                        const isSelected = domain.id === activeDomain?.id && viewMode === 'focus';
                                        const domainScore = calculateDomainScore(domain);
                                        return (
                                            <button
                                                key={domain.id}
                                                type="button"
                                                onClick={() => {
                                                    setViewMode('focus');
                                                    setSelectedDomainId(domain.id);
                                                }}
                                                className={`flex-shrink-0 flex items-center gap-2 px-3.5 py-2.5 rounded-2xl text-sm font-medium transition-all border min-h-[44px] ${
                                                    isSelected
                                                        ? 'bg-brand-600 text-white border-brand-600 shadow-sm'
                                                        : 'bg-surface text-slate-600 border-slate-200 hover:border-brand-300'
                                                }`}
                                            >
                                                <span>{domain.icon}</span>
                                                <span>{domain.name}</span>
                                                <span
                                                    className={`text-xs font-bold px-1.5 py-0.5 rounded-full ${
                                                        isSelected
                                                            ? 'bg-white/20 text-white'
                                                            : 'bg-slate-100 text-slate-500'
                                                    }`}
                                                >
                                                    {domainScore}%
                                                </span>
                                            </button>
                                        );
                                    })}

                                    <button
                                        type="button"
                                        onClick={() => setShowAddDomain((prev) => !prev)}
                                        className="flex-shrink-0 flex items-center gap-1 px-3.5 py-2.5 rounded-2xl text-sm font-bold border border-dashed border-slate-300 text-slate-500 hover:border-brand-400 hover:text-brand-600 transition-colors min-h-[44px]"
                                    >
                                        <span>+</span>
                                        <span>مجال</span>
                                    </button>
                                </div>

                                {showAddDomain && (
                                    <AddDomainForm
                                        onAdd={addDomain}
                                        initialEditing={true}
                                        onCancel={() => setShowAddDomain(false)}
                                    />
                                )}

                                {viewMode === 'focus' && activeDomain && (
                                    <div className="space-y-4">
                                        <DomainCard
                                            key={activeDomain.id}
                                            domain={activeDomain}
                                            score={calculateDomainScore(activeDomain)}
                                            onToggle={(goalId) => toggleGoal(activeDomain.id, goalId)}
                                            onUpdateNumeric={(goalId, delta) =>
                                                updateNumericGoal(activeDomain.id, goalId, delta)
                                            }
                                            onAddGoal={(goal) => addGoal(activeDomain.id, goal)}
                                            onRemoveGoal={(goalId) => removeGoal(activeDomain.id, goalId)}
                                            onRemove={() => removeDomain(activeDomain.id)}
                                        />

                                        {nextDomain && (
                                            <button
                                                type="button"
                                                onClick={goToNextDomain}
                                                className="w-full flex items-center justify-between bg-surface border border-slate-200/80 hover:border-brand-300 rounded-2xl px-4 py-3.5 text-sm transition-all shadow-sm min-h-[52px]"
                                            >
                                                <div className="flex items-center gap-2 text-slate-600">
                                                    <span className="text-xs text-slate-400">المجال التالي:</span>
                                                    <span className="font-bold text-slate-800">
                                                        {nextDomain.icon} {nextDomain.name}
                                                    </span>
                                                </div>
                                                <span className="text-brand-600 font-bold text-xs">انتقال ←</span>
                                            </button>
                                        )}
                                    </div>
                                )}

                                {viewMode === 'all' && (
                                    <div className="space-y-5">
                                        {domains.map((domain) => (
                                            <DomainCard
                                                key={domain.id}
                                                domain={domain}
                                                score={calculateDomainScore(domain)}
                                                onToggle={(goalId) => toggleGoal(domain.id, goalId)}
                                                onUpdateNumeric={(goalId, delta) =>
                                                    updateNumericGoal(domain.id, goalId, delta)
                                                }
                                                onAddGoal={(goal) => addGoal(domain.id, goal)}
                                                onRemoveGoal={(goalId) => removeGoal(domain.id, goalId)}
                                                onRemove={() => removeDomain(domain.id)}
                                                ref={(el) => {
                                                    domainRefs.current[domain.id] = el;
                                                }}
                                            />
                                        ))}

                                        <div className="pt-2">
                                            <AddDomainForm onAdd={addDomain} />
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {!isStandalone && !dismissedInstall && (
                            <PwaInstallCard
                                canInstall={Boolean(deferredPrompt)}
                                isIosBrowser={isIosBrowser}
                                onInstall={handlePwaInstall}
                                onDismiss={() => setDismissedInstall(true)}
                            />
                        )}

                        <LocalStorageFooter
                            dataByPeriod={dataByPeriod}
                            isPersisted={isPersisted}
                            justSaved={justSaved}
                            onImportData={(imported) => {
                                setDataByPeriod(imported);
                                setSelectedDomainId(imported[period]?.[0]?.id || null);
                            }}
                        />
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>

    <!-- Register Service Worker for Offline PWA Support -->
    <script>
        if (
            'serviceWorker' in navigator &&
            (window.location.protocol === 'https:' || window.location.hostname === 'localhost')
        ) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
